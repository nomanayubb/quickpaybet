services:
  db:
    image: postgres:16
    container_name: quickpaybet_db
    environment:
      POSTGRES_DB: quickpaybet
      POSTGRES_USER: quickpaybet
      POSTGRES_PASSWORD: quickpaybet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickpaybet"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quickpaybet_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: quickpaybet_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment: &backend_env
      DEBUG: "True"
      SECRET_KEY: "dev-only"
      DATABASE_URL: postgres://quickpaybet:quickpaybet@db:5432/quickpaybet
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOW_ALL_ORIGINS: "True"
    depends_on:
      - db
      - redis

  celery-worker:
    build:
      context: ./backend
    container_name: quickpaybet_celery_worker
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    environment: *backend_env
    depends_on:
      - db
      - redis

  celery-beat:
    build:
      context: ./backend
    container_name: quickpaybet_celery_beat
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    environment: *backend_env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
