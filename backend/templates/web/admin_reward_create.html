{% extends 'web/base.html' %}

{% block content %}
    <h1>Create Reward Package</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" required placeholder="e.g. Bronze">
        </div>
        <div class="form-group">
            <label>Deposit threshold (cumulative lifetime deposits required)</label>
            <input type="number" name="deposit_threshold" step="0.00000001" min="0.00000001" required>
        </div>
        <div class="form-group">
            <label>Commission rate bonus (%)</label>
            <input type="number" name="commission_rate_bonus" step="0.01" min="0" max="99" required>
        </div>
        <button type="submit" class="btn">Create Package</button>
    </form>

    <p><a href="{% url 'web:admin_rewards' %}">← Back to reward packages</a></p>
{% endblock %}
