{% extends 'web/base.html' %}
{% load static %}

{% block content %}
    <p><a href="{% if brand %}{% url 'web:casino_provider' brand.id %}{% else %}{% url 'web:casino_lobby' %}{% endif %}">&larr; Back to casino</a></p>
    <h1 style="margin:8px 0;">{{ game.name }}</h1>

    <div style="position:relative;width:100%;height:80vh;">
        <iframe
            src="{{ launch_url }}"
            style="width:100%;height:100%;border:0;border-radius:6px;"
            allow="autoplay; fullscreen"
            allowfullscreen
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-orientation-lock allow-pointer-lock allow-modals"
        ></iframe>
        <div id="casino-loading-overlay" style="position:absolute;inset:0;background:#ffffff;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#222;">
            <img src="{% static 'web/img/quickpaybet-logo.jpg' %}" alt="QuickPayBet" style="max-width:600px;width:90%;margin-bottom:40px;">
            <div style="width:75%;max-width:480px;height:12px;background:#e0e0e0;border-radius:6px;overflow:hidden;">
                <div id="casino-loading-bar" style="width:0%;height:100%;background:#222;"></div>
            </div>
            <p style="margin-top:28px;font-size:24px;color:#222;">Games provided by quickpaybet.com</p>
            <p style="margin-top:10px;font-size:18px;color:#555;">For API Access, Contact: quickpaybet@gmail.com</p>
        </div>
    </div>

    <script>
        // The provider's own loading sequence (including its own branding)
        // runs inside the iframe for a fixed window before the actual game
        // appears - this overlay covers our own page's view of that window
        // with our own branding for the same duration, then steps aside. It
        // never touches or modifies anything inside the iframe itself.
        (function () {
            var LOAD_MS = 17000;
            var bar = document.getElementById('casino-loading-bar');
            if (bar) {
                bar.style.transition = 'width ' + LOAD_MS + 'ms linear';
                requestAnimationFrame(function () { bar.style.width = '100%'; });
            }
            setTimeout(function () {
                var overlay = document.getElementById('casino-loading-overlay');
                if (overlay) { overlay.style.display = 'none'; }
            }, LOAD_MS);
        })();

        // Browsers include an iframe's own internal navigation in the
        // page's joint back/forward history - so once a game has navigated
        // within itself, pressing the browser's physical Back button can
        // land on one of the PROVIDER's own pages instead of ours. This
        // can't be prevented from inside the iframe (cross-origin - we have
        // no visibility into what it does), but we can control our own
        // page's response to Back: push a marker state on load, and on
        // every "back" event, immediately send the player to our own
        // casino page instead of letting the browser resolve it against
        // the iframe's history.
        (function () {
            var exitUrl = '{{ exit_url|escapejs }}';
            history.pushState({ casinoPlay: true }, '', location.href);
            window.addEventListener('popstate', function () {
                window.location.href = exitUrl;
            });
        })();
    </script>
{% endblock %}
