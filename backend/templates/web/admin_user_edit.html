{% extends 'web/base.html' %}

{% block content %}
    <h1>Edit User – {{ edit_user.email }}</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Role</label>
            <select name="role">
                <option value="user" {% if edit_user.role == 'user' %}selected{% endif %}>User</option>
                <option value="agent" {% if edit_user.role == 'agent' %}selected{% endif %}>Agent</option>
                <option value="master" {% if edit_user.role == 'master' %}selected{% endif %}>Master</option>
                <option value="admin" {% if edit_user.role == 'admin' %}selected{% endif %}>Admin</option>
            </select>
        </div>
        <div class="form-group">
            <label>Parent user</label>
            <select name="parent_id">
                <option value="">— None —</option>
                {% for parent in possible_parents %}
                    <option value="{{ parent.id }}" {% if edit_user.parent_id == parent.id %}selected{% endif %}>{{ parent.email }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Commission rate (%)</label>
            <input type="number" name="commission_rate" step="0.01" min="0" max="100"
                   value="{{ edit_user.commission_rate|default_if_none:'0' }}">
        </div>
        <div class="form-group">
            <label>Minimum bet</label>
            <input type="number" name="min_bet_amount" step="0.00000001" min="0"
                   value="{{ edit_user.min_bet_amount|default_if_none:'' }}" placeholder="Leave blank for no limit">
        </div>
        <div class="form-group">
            <label>Maximum bet</label>
            <input type="number" name="max_bet_amount" step="0.00000001" min="0"
                   value="{{ edit_user.max_bet_amount|default_if_none:'' }}" placeholder="Leave blank for no limit">
        </div>
        <div class="form-group">
            <label><input type="checkbox" name="is_betting_enabled" {% if edit_user.is_betting_enabled %}checked{% endif %}> Betting enabled</label>
        </div>
        <button type="submit" class="btn">Save changes</button>
    </form>

    <p><a href="{% url 'web:admin_users' %}">← Back to user list</a></p>
{% endblock %}
