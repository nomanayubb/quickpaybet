{% extends 'web/base.html' %}

{% block content %}
    <h1>Request Password Reset</h1>
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>
        <button type="submit" class="btn">Send Reset Instructions</button>
    </form>
{% endblock %}
