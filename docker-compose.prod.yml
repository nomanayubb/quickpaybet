services:
  db:
    image: postgres:16
    container_name: quickpaybet_prod_db
    environment:
      POSTGRES_DB: quickpaybet
      POSTGRES_USER: quickpaybet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickpaybet"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quickpaybet_prod_redis

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: quickpaybet_prod_backend
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      - db
      - redis

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: quickpaybet_prod_celery_worker
    command: celery -A config worker -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: quickpaybet_prod_celery_beat
    command: celery -A config beat -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.27-alpine
    container_name: quickpaybet_prod_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/static:ro
    depends_on:
      - backend

volumes:
  postgres_data_prod:
  static_volume:
